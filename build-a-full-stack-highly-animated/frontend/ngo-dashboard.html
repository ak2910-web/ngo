<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarthKind - NGO dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="ngo-pages.css"></head><body class="ngo-page"><nav class="ngo-nav"><a class="ngo-brand" href="index.html">* earthkind</a><div class="ngo-links"><a href="ngos.html">Explore NGOs</a><a href="ngo-register.html">Register another NGO</a><button class="ngo-button secondary" id="logout">Log out</button></div></nav><main class="ngo-shell"><section id="dashboardError" class="ngo-message hidden"></section><div id="dashboard" class="hidden"><section class="ngo-hero"><p class="ngo-kicker">NGO DASHBOARD</p><h1 id="ngoName">Your work, in one place.</h1><p>Manage your public profile and publish the projects, opportunities, events, and gallery moments your organization owns.</p></section><section id="stats" class="ngo-dashboard-grid"></section><section class="ngo-section ngo-panel"><h2>Organization profile</h2><form id="profileForm" class="ngo-form"><label>Organization name<input class="ngo-input" name="name" required></label><label>Official email<input class="ngo-input" name="email" disabled></label><label>Phone<input class="ngo-input" name="phone"></label><label>Contact person<input class="ngo-input" name="contactPerson"></label><label class="wide">Address<input class="ngo-input" name="address"></label><label>City<input class="ngo-input" name="city"></label><label>State<input class="ngo-input" name="state"></label><label>PIN code<input class="ngo-input" name="pinCode"></label><label>Website<input class="ngo-input" type="url" name="website"></label><label>Logo URL<input class="ngo-input" type="url" name="logo"></label><label>Established year<input class="ngo-input" type="number" name="establishedYear"></label><label class="wide">Description<textarea class="ngo-textarea" name="description"></textarea></label><label class="wide">Mission<textarea class="ngo-textarea" name="mission"></textarea></label><label class="wide">Vision<textarea class="ngo-textarea" name="vision"></textarea></label><label class="wide">Areas served<input class="ngo-input" name="areasServed"></label><fieldset class="wide" style="border:0;padding:0"><legend>Causes</legend><div id="causes" class="ngo-meta"></div></fieldset><p id="profileStatus" class="ngo-form-status" aria-live="polite"></p><button class="ngo-button">Save profile</button></form></section><section class="ngo-section ngo-columns"><article class="ngo-panel"><h2>Projects</h2><form id="projectForm" class="ngo-form"><input type="hidden" name="id"><label>Name<input class="ngo-input" name="name" required></label><label>Location<input class="ngo-input" name="location"></label><label class="wide">Description<textarea class="ngo-textarea" name="description"></textarea></label><label>Image URL<input class="ngo-input" name="image"></label><label>Status<select class="ngo-select" name="status"><option>active</option><option>draft</option><option>completed</option><option>archived</option></select></label><label>Volunteers needed<input class="ngo-input" type="number" name="requiredVolunteers" min="0"></label><p id="projectStatus" class="ngo-form-status"></p><button class="ngo-button">Save project</button></form><div id="projectList" class="ngo-list"></div></article><article class="ngo-panel"><h2>Volunteer opportunities</h2><form id="opportunityForm" class="ngo-form"><input type="hidden" name="id"><label>Title<input class="ngo-input" name="title" required></label><label>Location<input class="ngo-input" name="location"></label><label class="wide">Description<textarea class="ngo-textarea" name="description"></textarea></label><label>Type<select class="ngo-select" name="type"><option>offline</option><option>online</option><option>hybrid</option></select></label><label>Skills<input class="ngo-input" name="skills" placeholder="Comma separated"></label><label>Slots<input class="ngo-input" type="number" name="slots" min="1"></label><p id="opportunityStatus" class="ngo-form-status"></p><button class="ngo-button">Save opportunity</button></form><div id="opportunityList" class="ngo-list"></div></article></section><section class="ngo-section ngo-columns"><article class="ngo-panel"><h2>Events</h2><form id="eventForm" class="ngo-form"><input type="hidden" name="id"><label>Name<input class="ngo-input" name="name" required></label><label>Date<input class="ngo-input" type="date" name="date" required></label><label class="wide">Description<textarea class="ngo-textarea" name="description"></textarea></label><label>Location<input class="ngo-input" name="location"></label><label>Capacity<input class="ngo-input" type="number" name="capacity" min="1"></label><p id="eventStatus" class="ngo-form-status"></p><button class="ngo-button">Save event</button></form><div id="eventList" class="ngo-list"></div></article><article class="ngo-panel"><h2>Gallery</h2><form id="galleryForm" class="ngo-form"><label class="wide">Image URL<input class="ngo-input" type="url" name="url" required></label><label class="wide">Caption<input class="ngo-input" name="caption"></label><p id="galleryStatus" class="ngo-form-status"></p><button class="ngo-button">Add gallery item</button></form><div id="galleryList" class="ngo-list"></div></article></section></div></main><script src="ngo-dashboard.js"></script></body></html>
