<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EarthKind Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
.admin-page{min-height:100vh;background:var(--blush);padding:48px 6%;color:var(--ink)}.admin{max-width:1240px;margin:auto}.admin-top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:34px}.admin h1{margin:0;color:var(--plum);font:800 clamp(38px,5vw,62px)/1 'Plus Jakarta Sans',sans-serif;letter-spacing:-2px}.admin h1 em{color:var(--berry);font-style:normal}.admin-login{max-width:430px;margin:12vh auto;padding:34px;border:1px solid var(--line);border-radius:12px;background:#fff}.admin-login .brand{display:block;margin-bottom:34px}.admin-login h1{font-size:42px}.dashboard{display:none}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.admin-stat{padding:22px;border:1px solid var(--line);border-top:2px solid var(--berry);border-radius:10px;background:#fff}.admin-stat span{color:var(--muted);font-size:12px}.admin-stat strong{display:block;margin-top:8px;color:var(--plum);font:800 38px 'Plus Jakarta Sans',sans-serif}.admin-content{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:22px}.panel{padding:24px;border:1px solid var(--line);border-radius:10px;background:#fff}.panel h2{margin:0 0 18px;color:var(--plum);font:700 25px 'Plus Jakarta Sans',sans-serif}.search-row,.mini-list div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.search-row b{padding:4px 8px;border-radius:999px;background:#f7dfd5;color:var(--berry);font-size:11px}.collection-actions{display:flex;gap:8px;flex-wrap:wrap}.collection-actions button,.logout{border:0;border-radius:7px;padding:10px 13px;background:var(--plum);color:#fff;font-weight:700;cursor:pointer}.collection-actions button:hover,.logout:hover{background:var(--berry)}.mini-list{margin-top:17px}.mini-list button{border:0;border-radius:5px;padding:5px 7px;background:#f7dfd5;color:var(--berry);font-size:11px;font-weight:700;cursor:pointer}.mini-list button.danger{background:#fbe7e7;color:#a03737}.form{display:grid;gap:10px}.form input{width:100%;padding:13px;border:1px solid var(--line);border-radius:6px}.primary-button{padding:13px;border:0;border-radius:7px;background:var(--berry);color:#fff;font-weight:700;cursor:pointer}.admin-login small{color:#a03737}@media(max-width:760px){.admin-page{padding:28px 6%}.admin-top{align-items:flex-start;flex-direction:column}.admin-grid{grid-template-columns:1fr 1fr}.admin-content{display:block}.panel+.panel{margin-top:18px}}
</style>
</head>
<body class="admin-page">
<section class="admin-login" id="login"><a class="brand" href="index.html"><span class="brand-mark">+</span> earthkind</a><p class="eyebrow">ADMIN SPACE</p><h1>Welcome <em>back.</em></h1><form class="form" id="loginForm"><input type="email" name="email" placeholder="Admin email" required /><input type="password" name="password" placeholder="Password" required /><button class="primary-button">Enter dashboard</button><small id="loginError"></small></form></section>
<main class="admin dashboard" id="dashboard"><div class="admin-top"><div><p class="eyebrow">EARTHKIND ADMIN</p><h1>Good work,<br /><em>at a glance.</em></h1></div><button class="logout" id="logout">Log out</button></div><div class="admin-grid" id="stats"></div><div class="admin-content"><section class="panel"><p class="eyebrow">MOST SEARCHED</p><h2>What people are looking for</h2><div id="searches"></div></section><aside class="panel"><p class="eyebrow">MANAGE CONTENT</p><h2>Keep things moving</h2><div class="collection-actions"><button data-collection="ngos">NGOs</button><button data-collection="projects">Projects</button><button data-collection="events">Events</button><button data-collection="gallery">Gallery</button><button data-collection="volunteers">Volunteers</button><button data-collection="contacts">Contacts</button></div><div class="mini-list" id="records">Choose a collection to view recent records.</div></aside></div></main><script src="admin.js"></script>
</body>
</html>
