<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarthKind Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{background:#eef2eb}.admin{padding:110px 7% 60px;max-width:1300px;margin:auto}.admin-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:45px}.admin h1{font:60px 'Playfair Display';letter-spacing:-3px;margin:0}.admin h1 em{color:#397764}.admin-login{max-width:420px;margin:14vh auto;background:#f8f4ec;padding:42px;border-radius:18px}.admin-login h1{font-size:46px}.admin-login .brand{margin-bottom:45px}.dashboard{display:none}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.admin-stat{border-radius:15px;padding:23px;background:#fff;box-shadow:0 8px 20px #173d350a}.admin-stat span{font-size:12px;color:#668078}.admin-stat strong{display:block;font:46px 'Playfair Display';color:#173d35;margin-top:7px}.admin-content{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;margin-top:25px}.panel{background:#fff;border-radius:15px;padding:25px}.panel h2{font:27px 'Playfair Display';margin-top:0}.search-row{display:flex;justify-content:space-between;border-bottom:1px solid #e4e9e2;padding:12px 0;font-size:14px}.search-row b{background:#e8f1dc;color:#397764;border-radius:15px;padding:3px 8px;font-size:11px}.collection-actions{display:flex;gap:8px;flex-wrap:wrap}.collection-actions button,.logout{border:0;background:#173d35;color:#fff;border-radius:8px;padding:10px 13px;font:600 12px 'DM Sans';cursor:pointer}.collection-actions button:hover,.logout:hover{background:#397764}.mini-list{margin-top:17px}.mini-list div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e4e9e2;font-size:13px}@media(max-width:700px){.admin{padding:90px 6%}.admin-grid,.admin-content{grid-template-columns:1fr 1fr}.admin-content{display:block}.panel+ .panel{margin-top:18px}.admin h1{font-size:45px}}</style></head><body><section class="admin-login" id="login"><a class="brand" href="index.html"><i></i>earthkind</a><p class="eyebrow">ADMIN SPACE</p><h1>Welcome <em>back.</em></h1><form class="form" id="loginForm"><input type="email" name="email" placeholder="Admin email" required><input type="password" name="password" placeholder="Password" required><button class="primary-button">Enter dashboard <span>→</span></button><small id="loginError"></small></form></section><main class="admin dashboard" id="dashboard"><div class="admin-top"><div><p class="eyebrow">EARTHKIND ADMIN</p><h1>Good work,<br><em>at a glance.</em></h1></div><button class="logout" id="logout">Log out</button></div><div class="admin-grid" id="stats"></div><div class="admin-content"><section class="panel"><p class="eyebrow">MOST SEARCHED</p><h2>What people are looking for</h2><div id="searches"></div></section><aside class="panel"><p class="eyebrow">MANAGE CONTENT</p><h2>Keep things moving</h2><div class="collection-actions"><button data-collection="projects">Projects</button><button data-collection="events">Events</button><button data-collection="gallery">Gallery</button><button data-collection="volunteers">Volunteers</button><button data-collection="contacts">Contacts</button></div><div class="mini-list" id="records">Choose a collection to view recent records.</div></aside></div></main><script src="admin.js"></script></body></html>
