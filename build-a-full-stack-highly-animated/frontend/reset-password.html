<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f35">
  <title>Reset password | EarthKind</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7f2}
    .reset-card{width:min(100%,440px);padding:36px;background:#fff;border:1px solid #e5e9e2;border-radius:22px;box-shadow:0 20px 60px #173f3512}
    .reset-brand{font-weight:800;letter-spacing:-.04em;color:#173f35;font-size:1.4rem}
    .reset-card h1{margin:28px 0 8px;color:#173f35;font-size:2rem}
    .reset-card p{color:#68756d;line-height:1.6}
    .reset-card label{display:block;margin:20px 0 8px;font-weight:650;color:#263b31}
    .reset-card input{width:100%;padding:14px;border:1px solid #d8e0d8;border-radius:10px;font:inherit}
    .reset-card button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#173f35;color:white;font:inherit;font-weight:700;cursor:pointer}
    .reset-card button:disabled{opacity:.6;cursor:not-allowed}
    #message{margin-top:16px;font-size:.95rem}
    #message.error{color:#b42318}#message.success{color:#176b43}
    .reset-back{display:inline-block;margin-top:20px;color:#28624f;text-decoration:none}
  </style>
</head>
<body>
  <main class="reset-card">
    <a class="reset-brand" href="index.html">earthkind<span aria-hidden="true">.</span></a>
    <h1>Create a new password</h1>
    <p>Choose a strong password with at least 8 characters. This reset link can only be used once and expires after one hour.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      <button id="submitButton" type="submit">Update password</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <a class="reset-back" href="index.html">← Back to EarthKind</a>
  </main>
  <script>
    const API = "https://ngo-pi3s.onrender.com/api";
    const token = new URLSearchParams(window.location.search).get("token");
    const form = document.querySelector("#resetForm");
    const message = document.querySelector("#message");
    const button = document.querySelector("#submitButton");

    if (!token) {
      message.textContent = "This reset link is missing its token. Please request a new password reset.";
      message.className = "error";
      button.disabled = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      message.className = "";
      const password = document.querySelector("#password").value;
      const confirmation = document.querySelector("#confirmPassword").value;
      if (password.length < 8 || password.length > 128) {
        message.textContent = "Your password must contain 8 to 128 characters.";
        message.className = "error";
        return;
      }
      if (password !== confirmation) {
        message.textContent = "The passwords do not match.";
        message.className = "error";
        return;
      }
      button.disabled = true;
      button.textContent = "Updating…";
      try {
        const response = await fetch(`${API}/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to reset password.");
        form.hidden = true;
        message.textContent = "Your password has been updated. You can now sign in with your new password.";
        message.className = "success";
      } catch (error) {
        message.textContent = error.message;
        message.className = "error";
        button.disabled = false;
        button.textContent = "Update password";
      }
    });
  </script>
</body>
</html>
