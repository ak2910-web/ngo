<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarthKind - NGO registration</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="ngo-pages.css"></head><body class="ngo-page"><nav class="ngo-nav"><a class="ngo-brand" href="index.html">* earthkind</a><div class="ngo-links"><a href="ngos.html">Explore NGOs</a><a href="about.html">About</a><a href="contact.html">Contact</a><a class="ngo-button secondary" href="index.html">Back home</a></div></nav><main class="ngo-shell"><section class="ngo-hero"><p class="ngo-kicker">NGO ONBOARDING</p><h1>Bring your work into the network.</h1><p>Submit your organization for review. New organizations remain pending until an administrator verifies the information.</p></section><section class="ngo-section ngo-panel"><form id="registerForm" class="ngo-form"><label>Organization name<input class="ngo-input" name="name" required maxlength="120"></label><label>Official email<input class="ngo-input" type="email" name="email" required></label><label>Password<input class="ngo-input" type="password" name="password" minlength="8" required></label><label>Registration number<input class="ngo-input" name="registrationNumber" required></label><label>Phone<input class="ngo-input" name="phone" required></label><label>Contact person<input class="ngo-input" name="contactPerson" required></label><label class="wide">Address<input class="ngo-input" name="address" required></label><label>City<input class="ngo-input" name="city" required></label><label>State<input class="ngo-input" name="state" required></label><label>PIN code<input class="ngo-input" name="pinCode" pattern="[A-Za-z0-9 -]{4,10}" required></label><label>Website<input class="ngo-input" type="url" name="website" placeholder="https://"></label><label>Established year<input class="ngo-input" type="number" name="establishedYear" min="1800" max="2026"></label><label class="wide">Logo URL<input class="ngo-input" type="url" name="logo" placeholder="https://..."></label><label class="wide">Description<textarea class="ngo-textarea" name="description" required maxlength="2000"></textarea></label><label class="wide">Mission<textarea class="ngo-textarea" name="mission" required maxlength="1500"></textarea></label><label class="wide">Vision<textarea class="ngo-textarea" name="vision" maxlength="1500"></textarea></label><label class="wide">Areas served<input class="ngo-input" name="areasServed" placeholder="City, district, or state names separated by commas"></label><label class="wide">Registration/document information<textarea class="ngo-textarea" name="supportingDocumentInfo" placeholder="Describe the registration documents available for review."></textarea></label><fieldset class="wide" style="border:0;padding:0"><legend>Causes</legend><div id="causes" class="ngo-meta">Loading causes...</div></fieldset><p id="formStatus" class="ngo-form-status" aria-live="polite"></p><button class="ngo-button" type="submit">Submit for verification</button></form></section></main><script src="ngo-register.js"></script></body></html>
